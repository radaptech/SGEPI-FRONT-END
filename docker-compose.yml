services: 
  front:
    container_name: api_front
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    # --- A MÁGICA ACONTECE AQUI ---
    command: npm start # Sobrescreve o "serve" do Dockerfile apenas no seu PC
    # ------------------------------
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Garante que o Hot Reload funcione no Docker/Linux
      - WATCHPACK_POLLING=true